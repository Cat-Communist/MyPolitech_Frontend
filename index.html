<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Путешествие по Политеху</title>

<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/gallery.css">
<link rel="stylesheet" href="css/history.css">
<link rel="stylesheet" href="css/museum.css">
<link rel="stylesheet" href="css/reviews.css">
<link rel="stylesheet" href="css/review-form.css">
</head>
<body>

<div class="app">
  <div class="stage">
    <div class="bg" id="bg" aria-hidden="true"></div>
    <div class="slot" id="screen-slot"></div>
    <div class="slot" id="corner-slot"></div>
    <div class="slot" id="modal-slot"></div>
  </div>
</div>

<template id="tpl-loading">
  <div class="loading">
    <img class="loading__logo" data-img="logo" data-alt="logoAlt" alt="">
    <div class="loading__bar">
      <div class="loading__track">
        <div class="loading__fill"></div>
      </div>
      <div class="loading__row">
        <span data-text="loading"></span>
        <span class="loading__pct" id="progress-label"></span>
      </div>
    </div>
  </div>
</template>

<template id="tpl-menu">
  <div class="menu">
    <div class="menu__brand">
      <img class="menu__mark" data-img="mark" data-alt="markAlt" alt="">
      <h1 class="menu__title" data-text="title"></h1>
      <p class="menu__tagline" data-text="tagline"></p>
    </div>

    <div class="menu__modes">
      <button class="mode" type="button" data-mode="gallery">
        <span class="mode__num">01</span>
        <svg class="mode__icon" width="52" height="52" viewBox="0 0 68 68" aria-hidden="true">
          <rect x="6" y="16" width="46" height="38" rx="3"></rect>
          <path d="M14 10 H60 V46"></path>
          <circle cx="38" cy="29" r="4"></circle>
          <path d="M6 46 L20 32 L34 46 M28 40 L34 34 L52 50"></path>
        </svg>
        <span class="mode__text">
          <span class="mode__title" data-text="galleryTitle"></span>
          <span class="mode__desc" data-text="galleryDesc"></span>
        </span>
        <svg class="mode__arrow" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M5 14 H22 M15 7 L22 14 L15 21"></path>
        </svg>
      </button>

      <button class="mode" type="button" data-mode="history">
        <span class="mode__num">02</span>
        <svg class="mode__icon" width="52" height="52" viewBox="0 0 68 68" aria-hidden="true">
          <circle cx="34" cy="34" r="27"></circle>
          <polygon points="44,24 38,38 24,44 30,30"></polygon>
          <path d="M34 7 V12 M34 56 V61 M7 34 H12 M56 34 H61"></path>
        </svg>
        <span class="mode__text">
          <span class="mode__title" data-text="historyTitle"></span>
          <span class="mode__desc" data-text="historyDesc"></span>
        </span>
        <svg class="mode__arrow" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M5 14 H22 M15 7 L22 14 L15 21"></path>
        </svg>
      </button>

      <button class="mode" type="button" data-mode="museum">
        <span class="mode__num">03</span>
        <svg class="mode__icon" width="52" height="52" viewBox="0 0 68 68" aria-hidden="true">
          <path d="M8 24 L34 10 L60 24 Z"></path>
          <path d="M8 58 H60 M12 52 H56 M16 30 V52 M28 30 V52 M40 30 V52 M52 30 V52"></path>
        </svg>
        <span class="mode__text">
          <span class="mode__title" data-text="museumTitle"></span>
          <span class="mode__desc" data-text="museumDesc"></span>
        </span>
        <svg class="mode__arrow" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M5 14 H22 M15 7 L22 14 L15 21"></path>
        </svg>
      </button>

      <button class="mode" type="button" data-mode="reviews">
        <span class="mode__num">04</span>
        <svg class="mode__icon" width="52" height="52" viewBox="0 0 68 68" aria-hidden="true">
          <path d="M8 14 H60 V46 H30 L18 56 V46 H8 Z"></path>
          <path d="M18 26 H50 M18 35 H40"></path>
        </svg>
        <span class="mode__text">
          <span class="mode__title" data-text="reviewsTitle"></span>
          <span class="mode__desc" data-text="reviewsDesc"></span>
        </span>
        <svg class="mode__arrow" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M5 14 H22 M15 7 L22 14 L15 21"></path>
        </svg>
      </button>

      <button class="mode" type="button" data-mode="games">
        <span class="mode__num">05</span>
        <svg class="mode__icon" width="52" height="52" viewBox="0 0 68 68" aria-hidden="true">
          <path d="M20 20 H48 A14 14 0 0 1 62 34 V42 A8 8 0 0 1 48 48 L42 42 H26 L20 48 A8 8 0 0 1 6 42 V34 A14 14 0 0 1 20 20 Z"></path>
          <path d="M20 29 V39 M15 34 H25"></path>
          <circle cx="44" cy="31" r="2.5"></circle>
          <circle cx="50" cy="37" r="2.5"></circle>
        </svg>
        <span class="mode__text">
          <span class="mode__title" data-text="gamesTitle"></span>
          <span class="mode__desc" data-text="gamesDesc"></span>
        </span>
        <svg class="mode__arrow" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M5 14 H22 M15 7 L22 14 L15 21"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="footer">
    <img class="footer__logo" data-img="logo" data-alt="logoAlt" alt="">
    <span class="footer__text" data-text="university"></span>
  </div>
</template>

<template id="tpl-stub">
  <div class="stub">
    <div class="stub__card">
      <span class="stub__badge" id="stub-badge"></span>
      <h2 class="stub__title" data-text="soonTitle"></h2>
      <p class="stub__text" id="stub-text"></p>
      <button class="btn-back" type="button" id="btn-back">
        <svg class="btn-back__icon" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M23 14 H6 M13 7 L6 14 L13 21"></path>
        </svg>
        <span data-text="back"></span>
      </button>
    </div>
  </div>
</template>

<template id="tpl-gallery">
  <div class="gallery">
    <div class="head">
      <button class="chip" type="button" data-go="menu">
        <svg class="chip__icon" width="22" height="22" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M23 14 H6 M13 7 L6 14 L13 21"></path>
        </svg>
        <span data-text="back"></span>
      </button>
      <div class="head__titles">
        <span class="head__kicker" data-text="galleryFull"></span>
        <span class="head__title" data-text="albumTitle"></span>
      </div>
      <img class="head__mark" data-img="mark" data-alt="markAlt" alt="">
    </div>

    <div class="tl">
      <button class="round" type="button" id="tl-prev" data-alt-text="yearsPrev">
        <svg class="round__icon" width="20" height="20" viewBox="0 0 28 28" aria-hidden="true"><path d="M17 6 L9 14 L17 22"></path></svg>
      </button>
      <div class="tl__track">
        <div class="tl__line"></div>
        <div class="tl__years" id="tl-years"></div>
      </div>
      <button class="round" type="button" id="tl-next" data-alt-text="yearsNext">
        <svg class="round__icon" width="20" height="20" viewBox="0 0 28 28" aria-hidden="true"><path d="M11 6 L19 14 L11 22"></path></svg>
      </button>
    </div>

    <div class="album" id="album">
      <div class="album__sheet album__sheet--3"></div>
      <div class="album__sheet album__sheet--2"></div>
      <div class="album__sheet album__sheet--1"></div>
      <div class="album__half album__half--l" id="page-l"></div>
      <div class="album__half album__half--r" id="page-r"></div>
      <div class="album__under" id="album-under"></div>
      <div class="album__spine"></div>
      <div class="album__leaf" id="album-leaf">
        <div class="album__face" id="leaf-front"></div>
        <div class="album__face album__face--back" id="leaf-back"></div>
      </div>
      <button class="album__corner album__corner--l" type="button" id="corner-prev" data-alt-text="spreadPrev"></button>
      <button class="album__corner album__corner--r" type="button" id="corner-next" data-alt-text="spreadNext"></button>
    </div>

    <button class="round round--lg album__nav album__nav--prev" type="button" id="album-prev" data-alt-text="spreadPrev">
      <svg class="round__icon" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><path d="M17 6 L9 14 L17 22"></path></svg>
    </button>
    <button class="round round--lg round--primary album__nav album__nav--next" type="button" id="album-next" data-alt-text="spreadNext">
      <svg class="round__icon" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><path d="M11 6 L19 14 L11 22"></path></svg>
    </button>

    <div class="album-foot">
      <span class="album-foot__year" id="foot-year"></span>
      <div class="album-foot__dots" id="foot-dots"></div>
      <span class="album-foot__spread" id="foot-spread"></span>
      <span class="album-foot__no" id="foot-no"></span>
    </div>
  </div>
</template>

<!-- Страницы альбома: gallery.js клонирует их и заполняет из js/data/gallery.js. -->
<template id="tpl-page-title">
  <div class="page">
    <div class="page__top">
      <span data-text="release"></span>
      <span class="page__num" data-slot="num"></span>
    </div>
    <span class="page__year" data-slot="year"></span>
    <span class="page__meta" data-slot="meta"></span>
    <button class="photo photo--fill" type="button" data-slot="photo0"></button>
    <span class="page__caption" data-slot="caption"></span>
  </div>
</template>

<template id="tpl-page-photos">
  <div class="page">
    <div class="page__top">
      <span data-slot="release"></span>
      <span class="page__num" data-slot="num"></span>
    </div>
    <button class="photo photo--big" type="button" data-slot="photo0"></button>
    <span class="page__caption" data-slot="caption"></span>
    <div class="page__row">
      <button class="photo photo--small" type="button" data-slot="photo1"></button>
      <button class="photo photo--small" type="button" data-slot="photo2"></button>
    </div>
  </div>
</template>

<template id="tpl-page-end">
  <div class="page page--end">
    <span data-text="albumEnd"></span>
  </div>
</template>

<!-- Просмотр одного фото: открывается поверх альбома, альбом под ним не сбрасывается. -->
<template id="tpl-viewer">
  <div class="viewer" id="viewer">
    <div class="head">
      <button class="chip" type="button" data-go="menu">
        <svg class="chip__icon" width="22" height="22" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M23 14 H6 M13 7 L6 14 L13 21"></path>
        </svg>
        <span data-text="back"></span>
      </button>
      <button class="chip chip--plain" type="button" id="viewer-close">
        <span data-text="toAlbum"></span>
      </button>
      <div class="head__titles viewer__titles">
        <span class="head__kicker" id="viewer-kicker"></span>
        <span class="head__title" data-text="viewerTitle"></span>
      </div>
      <img class="head__mark" data-img="mark" data-alt="markAlt" alt="">
    </div>

    <div class="viewer__frame" id="viewer-frame"></div>

    <button class="round round--lg viewer__nav viewer__nav--prev" type="button" id="viewer-prev" data-alt-text="photoPrev">
      <svg class="round__icon" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><path d="M17 6 L9 14 L17 22"></path></svg>
    </button>
    <button class="round round--lg viewer__nav viewer__nav--next" type="button" id="viewer-next" data-alt-text="photoNext">
      <svg class="round__icon" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><path d="M11 6 L19 14 L11 22"></path></svg>
    </button>

    <div class="viewer__info">
      <span class="viewer__num" id="viewer-num"></span>
      <span class="viewer__name" id="viewer-name"></span>
      <p class="viewer__caption" id="viewer-caption"></p>
      <div class="viewer__rule"></div>
      <div class="viewer__field">
        <span class="viewer__label" data-text="institute"></span>
        <span class="viewer__value" id="viewer-institute"></span>
      </div>
      <div class="viewer__spacer"></div>
      <button class="viewer__all" type="button" id="viewer-all">
        <svg class="viewer__all-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        <span data-text="allPhotos"></span>
      </button>
    </div>

    <div class="viewer__thumbs" id="viewer-thumbs"></div>
  </div>
</template>

<!-- История: контейнер раздела; history.js кладёт в него схему или страницу направления. -->
<template id="tpl-history">
  <div class="history" id="history"></div>
</template>

<template id="tpl-history-board">
  <div class="board-screen">
    <div class="head">
      <button class="chip" type="button" data-go="menu">
        <svg class="chip__icon" width="22" height="22" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M23 14 H6 M13 7 L6 14 L13 21"></path>
        </svg>
        <span data-text="back"></span>
      </button>
      <div class="head__titles">
        <span class="head__kicker" data-text="historyTitle"></span>
        <span class="head__title" data-text="boardTitle"></span>
      </div>
      <img class="head__mark" data-img="mark" data-alt="markAlt" alt="">
    </div>

    <div class="board" id="board">
      <svg class="board__traces" id="board-traces" width="1060" height="730" viewBox="0 0 1060 730" aria-hidden="true"></svg>
      <div class="board__core">
        <span class="board__core-name" id="core-name"></span>
        <span class="board__core-sub" id="core-sub"></span>
      </div>
      <div id="board-nodes"></div>
      <div class="board__legend">
        <span id="legend-inst"></span>
        <span id="legend-dir"></span>
      </div>
      <div class="board__key">
        <span class="board__key-pin"></span>
        <span data-text="pinLegend"></span>
      </div>
    </div>

    <div class="inst-panel">
      <span class="inst-panel__code" id="inst-code"></span>
      <span class="inst-panel__name" id="inst-name"></span>
      <p class="inst-panel__about" id="inst-about"></p>
      <div class="inst-panel__rule"></div>
      <span class="inst-panel__count" id="inst-count"></span>
      <div class="inst-panel__list" id="inst-dirs"></div>
      <button class="btn-primary" type="button" id="btn-read">
        <span id="read-label"></span>
        <svg class="btn-primary__icon" width="20" height="20" viewBox="0 0 28 28" aria-hidden="true"><path d="M5 14 H22 M15 7 L22 14 L15 21"></path></svg>
      </button>
    </div>
  </div>
</template>

<template id="tpl-history-node">
  <button class="node" type="button">
    <span class="node__box">
      <span class="node__chip"><span class="node__chip-core"></span></span>
      <span class="node__text">
        <span class="node__label" data-slot="label"></span>
        <span class="node__sub" data-slot="sub"></span>
      </span>
    </span>
    <span class="node__pins" data-slot="pins"></span>
  </button>
</template>

<template id="tpl-history-dir">
  <button class="dir-row" type="button">
    <span class="dir-row__code" data-slot="code"></span>
    <span class="dir-row__name" data-slot="name"></span>
    <svg class="dir-row__icon" width="18" height="18" viewBox="0 0 28 28" aria-hidden="true"><path d="M5 14 H22 M15 7 L22 14 L15 21"></path></svg>
  </button>
</template>

<template id="tpl-history-page">
  <div class="dir-page">
    <div class="head">
      <button class="chip" type="button" data-go="menu">
        <svg class="chip__icon" width="22" height="22" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M23 14 H6 M13 7 L6 14 L13 21"></path>
        </svg>
        <span data-text="back"></span>
      </button>
      <button class="chip chip--plain" type="button" id="btn-all-dirs">
        <span data-text="allDirections"></span>
      </button>
      <div class="head__titles"></div>
      <img class="head__mark" data-img="mark" data-alt="markAlt" alt="">
    </div>

    <div class="dir-page__card">
      <span class="dir-page__inst" id="page-inst"></span>
      <h2 class="dir-page__title" id="page-title"></h2>
      <div class="dir-page__text" id="page-text"></div>
      <div class="dir-page__rule"></div>
      <span class="dir-page__label" data-text="keyStages"></span>
      <div class="dir-page__stages" id="page-stages"></div>
    </div>

    <div class="dir-page__photo" id="page-photo"></div>
    <span class="dir-page__caption" id="page-caption"></span>

    <div class="dir-page__nav">
      <button class="dir-page__btn" type="button" id="dir-prev">
        <svg class="dir-page__btn-icon" width="20" height="20" viewBox="0 0 28 28" aria-hidden="true"><path d="M17 6 L9 14 L17 22"></path></svg>
        <span data-text="prevDirection"></span>
      </button>
      <button class="dir-page__btn dir-page__btn--primary" type="button" id="dir-next">
        <span data-text="nextDirection"></span>
        <svg class="dir-page__btn-icon" width="20" height="20" viewBox="0 0 28 28" aria-hidden="true"><path d="M11 6 L19 14 L11 22"></path></svg>
      </button>
    </div>
  </div>
</template>

<!-- Музей: контейнер раздела; museum.js кладёт в него зал или экспонат. -->
<template id="tpl-museum">
  <div class="museum" id="museum"></div>
</template>

<template id="tpl-museum-hall">
  <div class="hall-screen">
    <div class="head">
      <button class="chip" type="button" data-go="menu">
        <svg class="chip__icon" width="22" height="22" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M23 14 H6 M13 7 L6 14 L13 21"></path>
        </svg>
        <span data-text="back"></span>
      </button>
      <div class="head__titles">
        <span class="head__kicker" data-text="museumTitle"></span>
        <span class="head__title" data-text="hallsTitle"></span>
      </div>
      <img class="head__mark" data-img="mark" data-alt="markAlt" alt="">
    </div>

    <div class="arches" id="arches"></div>

    <div class="hall-panel">
      <span class="hall-panel__label" id="hall-label"></span>
      <span class="hall-panel__name" id="hall-name"></span>
      <span class="hall-panel__years" id="hall-years"></span>
      <p class="hall-panel__about" id="hall-about"></p>
      <div class="hall-panel__spacer"></div>
      <span class="hall-panel__count" id="hall-count"></span>
      <div class="pair">
        <button class="pair__btn" type="button" id="hall-prev">
          <svg class="pair__icon" width="18" height="18" viewBox="0 0 28 28" aria-hidden="true"><path d="M17 6 L9 14 L17 22"></path></svg>
          <span data-text="hallPrev"></span>
        </button>
        <button class="pair__btn pair__btn--primary" type="button" id="hall-next">
          <span data-text="hallNext"></span>
          <svg class="pair__icon" width="18" height="18" viewBox="0 0 28 28" aria-hidden="true"><path d="M11 6 L19 14 L11 22"></path></svg>
        </button>
      </div>
    </div>

    <div class="cases" id="cases"></div>
  </div>
</template>

<template id="tpl-museum-arch">
  <button class="arch" type="button">
    <span class="arch__num" data-slot="num"></span>
    <span class="arch__name" data-slot="name"></span>
    <span class="arch__years" data-slot="years"></span>
  </button>
</template>

<template id="tpl-museum-case">
  <button class="case" type="button">
    <span class="glass">
      <span class="glass__photo" data-slot="photo"></span>
      <span class="glass__glare"></span>
    </span>
    <span class="case__plate">
      <span class="case__year" data-slot="year"></span>
      <span class="case__rule"></span>
      <span class="case__text">
        <span class="case__name" data-slot="name"></span>
        <span class="case__code" data-slot="code"></span>
      </span>
    </span>
  </button>
</template>

<template id="tpl-museum-exhibit">
  <div class="exhibit">
    <div class="head">
      <button class="chip" type="button" data-go="menu">
        <svg class="chip__icon" width="22" height="22" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M23 14 H6 M13 7 L6 14 L13 21"></path>
        </svg>
        <span data-text="back"></span>
      </button>
      <button class="chip chip--plain" type="button" id="btn-to-hall">
        <span data-text="toHall"></span>
      </button>
      <div class="head__titles exhibit__titles">
        <span class="head__kicker" id="exhibit-kicker"></span>
        <span class="head__title" data-text="exhibitTitle"></span>
      </div>
      <img class="head__mark" data-img="mark" data-alt="markAlt" alt="">
    </div>

    <div class="exhibit__stage">
      <div class="glass glass--big">
        <div class="glass__photo" id="exhibit-photo"></div>
        <div class="glass__glare"></div>
      </div>
    </div>

    <div class="label">
      <span class="label__code" id="exhibit-code"></span>
      <span class="label__name" id="exhibit-name"></span>
      <span class="label__year" id="exhibit-year"></span>
      <p class="label__about" id="exhibit-about"></p>
      <div class="label__rows" id="exhibit-rows"></div>
      <div class="label__spacer"></div>
      <span class="label__caption" data-text="inThisHall"></span>
      <div class="label__thumbs" id="exhibit-thumbs"></div>
      <div class="pair">
        <button class="pair__btn" type="button" id="exhibit-prev">
          <svg class="pair__icon" width="18" height="18" viewBox="0 0 28 28" aria-hidden="true"><path d="M17 6 L9 14 L17 22"></path></svg>
          <span data-text="exhibitPrev"></span>
        </button>
        <button class="pair__btn pair__btn--primary" type="button" id="exhibit-next">
          <span data-text="exhibitNext"></span>
          <svg class="pair__icon" width="18" height="18" viewBox="0 0 28 28" aria-hidden="true"><path d="M11 6 L19 14 L11 22"></path></svg>
        </button>
      </div>
    </div>
  </div>
</template>

<!-- Отзывы: лента; reviews.js заполняет фильтры и карточки из данных. -->
<template id="tpl-reviews">
  <div class="reviews" id="reviews">
    <div class="head">
      <button class="chip" type="button" data-go="menu">
        <svg class="chip__icon" width="22" height="22" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M23 14 H6 M13 7 L6 14 L13 21"></path>
        </svg>
        <span data-text="back"></span>
      </button>
      <div class="head__titles">
        <span class="head__kicker" data-text="reviewsTitle"></span>
        <span class="head__title" data-text="reviewsFull"></span>
      </div>
      <button class="btn-write" type="button" id="btn-write">
        <svg class="btn-write__icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20 L5 15 L15.5 4.5 A2.1 2.1 0 0 1 19.5 8.5 L9 19 Z"></path>
        </svg>
        <span data-text="writeReview"></span>
      </button>
      <img class="head__mark" data-img="mark" data-alt="markAlt" alt="">
    </div>

    <div class="filters">
      <div class="filters__row" id="filters"></div>
      <span class="filters__count" id="reviews-count"></span>
    </div>

    <div class="feed" id="feed">
      <div class="feed__cols" id="feed-cols"></div>
      <p class="feed__empty" id="feed-empty" data-text="noReviews" hidden></p>
      <div class="feed__more">
        <button class="feed__more-btn" type="button" id="btn-more" data-text="showMore"></button>
      </div>
    </div>
  </div>
</template>

<template id="tpl-review">
  <article class="review">
    <svg class="review__quote" width="34" height="26" viewBox="0 0 34 26" aria-hidden="true">
      <path d="M0 26 V14 C0 6 4 1 12 0 L13 4 C8 5 6 8 6 12 H12 V26 Z M20 26 V14 C20 6 24 1 32 0 L33 4 C28 5 26 8 26 12 H32 V26 Z"></path>
    </svg>
    <div class="review__photo" data-slot="photo" hidden></div>
    <p class="review__text" data-slot="text"></p>
    <div class="review__rule"></div>
    <div class="review__author">
      <span class="review__avatar" data-slot="initials"></span>
      <span class="review__who">
        <span class="review__name" data-slot="name"></span>
        <span class="review__meta" data-slot="meta"></span>
      </span>
    </div>
  </article>
</template>

<!-- Форма отзыва. Данные никуда не отправляются: см. submitReview() в js/review-form.js. -->
<template id="tpl-review-form">
  <div class="rform" id="review-form">
    <div class="head">
      <button class="chip" type="button" data-go="menu">
        <svg class="chip__icon" width="22" height="22" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M23 14 H6 M13 7 L6 14 L13 21"></path>
        </svg>
        <span data-text="back"></span>
      </button>
      <button class="chip chip--plain" type="button" data-go="reviews">
        <span data-text="allReviews"></span>
      </button>
      <div class="head__titles"></div>
      <img class="head__mark" data-img="mark" data-alt="markAlt" alt="">
    </div>

    <div class="rform__intro">
      <span class="rform__kicker" data-text="reviewsFull"></span>
      <h2 class="rform__title" data-text="formTitle"></h2>
      <p class="rform__lead" data-text="formLead"></p>
      <div class="rform__notes">
        <div class="rform__note"><span class="rform__note-num">01</span><span data-text="formNote1"></span></div>
        <div class="rform__note"><span class="rform__note-num">02</span><span data-text="formNote2"></span></div>
        <div class="rform__note"><span class="rform__note-num">03</span><span data-text="formNote3"></span></div>
      </div>
    </div>

    <form class="rform__card" id="rform-card" novalidate>
      <div class="rform__summary" id="rform-summary" hidden>
        <svg class="rform__summary-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle><path d="M12 7 V13"></path><circle class="rform__dot" cx="12" cy="16.5" r=".8"></circle>
        </svg>
        <span id="rform-summary-text"></span>
      </div>

      <div class="rform__grid">
        <div class="rform__col">
          <label class="field">
            <span class="field__label"><span data-text="fieldName"></span> <span class="field__star">*</span></span>
            <input class="field__input" name="name" type="text" autocomplete="name" data-placeholder="namePlaceholder">
            <span class="field__error" data-err="name"></span>
          </label>
          <label class="field">
            <span class="field__label"><span data-text="fieldYear"></span> <span class="field__star">*</span></span>
            <input class="field__input field__input--mono" name="year" type="text" inputmode="numeric" maxlength="4" data-placeholder="yearPlaceholder">
            <span class="field__error" data-err="year"></span>
          </label>
          <label class="field">
            <span class="field__label"><span data-text="fieldDirection"></span> <span class="field__star">*</span></span>
            <span class="select">
              <select class="field__input select__box" name="direction" id="rform-direction"></select>
              <svg class="select__arrow" width="18" height="18" viewBox="0 0 28 28" aria-hidden="true"><path d="M6 11 L14 19 L22 11"></path></svg>
            </span>
            <span class="field__error" data-err="direction"></span>
          </label>
          <div class="field field--grow">
            <span class="field__label"><span data-text="fieldPhoto"></span> <span class="field__optional" data-text="optional"></span></span>
            <label class="drop" id="rform-drop">
              <svg class="drop__icon" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
                <rect x="3" y="6" width="22" height="17" rx="3"></rect><circle cx="14" cy="14.5" r="4.5"></circle><path d="M10 6 L11.5 3.5 H16.5 L18 6"></path>
              </svg>
              <span><span data-text="dropHint"></span> <span class="drop__link" data-text="dropPick"></span></span>
              <input class="drop__input" type="file" accept="image/*" id="rform-file">
            </label>
            <div class="attached" id="rform-attached" hidden>
              <img class="attached__thumb" id="rform-thumb" alt="">
              <span class="attached__text">
                <span class="attached__name" id="rform-filename"></span>
                <span class="attached__note" data-text="photoAttached"></span>
              </span>
              <button class="attached__clear" type="button" id="rform-clear" data-alt-text="photoRemove">
                <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3 L13 13 M13 3 L3 13"></path></svg>
              </button>
            </div>
          </div>
        </div>

        <label class="field field--text">
          <span class="field__label"><span data-text="fieldText"></span> <span class="field__star">*</span></span>
          <textarea class="field__input field__area" name="text" maxlength="1000" data-placeholder="textPlaceholder"></textarea>
          <span class="field__foot">
            <span class="field__error" data-err="text"></span>
            <span class="field__count" id="rform-count"></span>
          </span>
        </label>
      </div>

      <div class="rform__rule"></div>

      <div class="rform__bottom">
        <div class="agree">
          <button class="agree__btn" type="button" role="checkbox" aria-checked="false" id="rform-agree">
            <span class="agree__box">
              <svg class="agree__tick" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 9.5 L7.5 13 L14.5 5"></path></svg>
            </span>
            <span class="agree__text"><span data-text="agreeText"></span> <span class="agree__link" data-text="agreeLink"></span> <span class="field__star">*</span></span>
          </button>
          <span class="field__error" data-err="agree"></span>
        </div>
        <button class="rform__submit" type="submit">
          <span data-text="submitReview"></span>
          <svg class="rform__submit-icon" width="22" height="22" viewBox="0 0 28 28" aria-hidden="true"><path d="M5 14 H22 M15 7 L22 14 L15 21"></path></svg>
        </button>
      </div>
    </form>

    <div class="thanks" id="rform-thanks" hidden>
      <span class="thanks__badge">
        <svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><path d="M13 28 L23 38 L42 17"></path></svg>
      </span>
      <h3 class="thanks__title" data-text="thanksTitle"></h3>
      <p class="thanks__sub" data-text="thanksSub"></p>
      <p class="thanks__text" data-text="thanksText"></p>
      <div class="thanks__actions">
        <button class="thanks__primary" type="button" data-go="reviews"><span data-text="toReviews"></span></button>
        <button class="thanks__again" type="button" id="rform-again" data-text="writeAgain"></button>
      </div>
    </div>
  </div>
</template>

<template id="tpl-corner">
  <div class="corner" id="corner" data-sound="off">
    <button class="corner__btn" type="button" id="btn-about">
      <svg class="corner__icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 11 V17"></path>
        <circle class="corner__icon-dot" cx="12" cy="7.5" r=".6"></circle>
      </svg>
      <span data-text="about"></span>
    </button>

    <button class="corner__btn" type="button" id="btn-sound" aria-pressed="false">
      <svg class="corner__icon corner__icon--sound" width="24" height="24" viewBox="0 0 26 26" aria-hidden="true">
        <path d="M3 10 H8 L14 5 V21 L8 16 H3 Z"></path>
        <path class="snd-on" d="M17.5 9.5 Q20 13 17.5 16.5"></path>
        <path class="snd-on" d="M20 6.5 Q25 13 20 19.5"></path>
        <path class="snd-off" d="M18 10 L24 16 M24 10 L18 16"></path>
      </svg>
      <span id="sound-label"></span>
    </button>
  </div>
</template>

<template id="tpl-about">
  <div class="about" id="about-overlay" role="dialog" aria-modal="true" aria-labelledby="about-title">
    <div class="about__dialog" id="about-dialog">
      <h2 class="about__title" id="about-title" data-text="aboutTitle"></h2>
      <p class="about__text" data-text="aboutText1"></p>
      <p class="about__text about__text--dim" data-text="aboutText2"></p>
      <button class="about__ok" type="button" id="btn-about-ok" data-text="aboutOk"></button>
    </div>
  </div>
</template>

<script src="js/config.js"></script>
<script src="js/data/gallery.js"></script>
<script src="js/data/history.js"></script>
<script src="js/data/museum.js"></script>
<script src="js/data/reviews.js"></script>
<script src="js/screens.js"></script>
<script src="js/gallery.js"></script>
<script src="js/history.js"></script>
<script src="js/museum.js"></script>
<script src="js/reviews.js"></script>
<script src="js/review-form.js"></script>
<script src="js/main.js"></script>
</body>
</html>
