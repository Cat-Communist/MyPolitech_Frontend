<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Путешествие по Политеху</title>

<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/gallery.css">
</head>
<body>

<div class="app">
  <div class="stage">
    <div class="bg" id="bg" aria-hidden="true"></div>
    <div class="slot" id="screen-slot"></div>
    <div class="slot" id="corner-slot"></div>
    <div class="slot" id="modal-slot"></div>
  </div>
</div>

<template id="tpl-loading">
  <div class="loading">
    <img class="loading__logo" data-img="logo" data-alt="logoAlt" alt="">
    <div class="loading__bar">
      <div class="loading__track">
        <div class="loading__fill"></div>
      </div>
      <div class="loading__row">
        <span data-text="loading"></span>
        <span class="loading__pct" id="progress-label"></span>
      </div>
    </div>
  </div>
</template>

<template id="tpl-menu">
  <div class="menu">
    <div class="menu__brand">
      <img class="menu__mark" data-img="mark" data-alt="markAlt" alt="">
      <h1 class="menu__title" data-text="title"></h1>
      <p class="menu__tagline" data-text="tagline"></p>
    </div>

    <div class="menu__modes">
      <button class="mode" type="button" data-mode="gallery">
        <span class="mode__num">01</span>
        <svg class="mode__icon" width="60" height="60" viewBox="0 0 68 68" aria-hidden="true">
          <rect x="6" y="16" width="46" height="38" rx="3"></rect>
          <path d="M14 10 H60 V46"></path>
          <circle cx="38" cy="29" r="4"></circle>
          <path d="M6 46 L20 32 L34 46"></path>
          <path d="M28 40 L34 34 L52 50"></path>
        </svg>
        <span class="mode__text">
          <span class="mode__title" data-text="galleryTitle"></span>
          <span class="mode__desc" data-text="galleryDesc"></span>
        </span>
        <svg class="mode__arrow" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M5 14 H22 M15 7 L22 14 L15 21"></path>
        </svg>
      </button>

      <button class="mode" type="button" data-mode="history">
        <span class="mode__num">02</span>
        <svg class="mode__icon" width="60" height="60" viewBox="0 0 68 68" aria-hidden="true">
          <circle cx="34" cy="34" r="27"></circle>
          <polygon points="44,24 38,38 24,44 30,30"></polygon>
          <circle cx="34" cy="34" r="2"></circle>
          <path d="M34 7 V12 M34 56 V61 M7 34 H12 M56 34 H61"></path>
        </svg>
        <span class="mode__text">
          <span class="mode__title" data-text="historyTitle"></span>
          <span class="mode__desc" data-text="historyDesc"></span>
        </span>
        <svg class="mode__arrow" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M5 14 H22 M15 7 L22 14 L15 21"></path>
        </svg>
      </button>

      <button class="mode" type="button" data-mode="games">
        <span class="mode__num">03</span>
        <svg class="mode__icon" width="60" height="60" viewBox="0 0 68 68" aria-hidden="true">
          <path d="M20 18 H48 C58 18 64 28 64 40 C64 50 58 54 52 52 L44 44 H24 L16 52 C10 54 4 50 4 40 C4 28 10 18 20 18 Z"></path>
          <path d="M20 26 V38 M14 32 H26"></path>
          <circle cx="44" cy="29" r="2.5"></circle>
          <circle cx="51" cy="35" r="2.5"></circle>
        </svg>
        <span class="mode__text">
          <span class="mode__title" data-text="gamesTitle"></span>
          <span class="mode__desc" data-text="gamesDesc"></span>
        </span>
        <svg class="mode__arrow" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M5 14 H22 M15 7 L22 14 L15 21"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="footer">
    <img class="footer__logo" data-img="logo" data-alt="logoAlt" alt="">
    <span class="footer__text" data-text="university"></span>
  </div>
</template>

<template id="tpl-stub">
  <div class="stub">
    <div class="stub__card">
      <span class="stub__badge" id="stub-badge"></span>
      <h2 class="stub__title" data-text="soonTitle"></h2>
      <p class="stub__text" id="stub-text"></p>
      <button class="btn-back" type="button" id="btn-back">
        <svg class="btn-back__icon" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M23 14 H6 M13 7 L6 14 L13 21"></path>
        </svg>
        <span data-text="back"></span>
      </button>
    </div>
  </div>
</template>

<template id="tpl-gallery">
  <div class="gallery">
    <div class="head">
      <button class="chip" type="button" data-go="menu">
        <svg class="chip__icon" width="22" height="22" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M23 14 H6 M13 7 L6 14 L13 21"></path>
        </svg>
        <span data-text="back"></span>
      </button>
      <div class="head__titles">
        <span class="head__kicker" data-text="galleryTitle"></span>
        <span class="head__title" data-text="albumTitle"></span>
      </div>
      <img class="head__mark" data-img="mark" data-alt="markAlt" alt="">
    </div>

    <div class="tl">
      <button class="round" type="button" id="tl-prev" data-alt-text="yearsPrev">
        <svg class="round__icon" width="20" height="20" viewBox="0 0 28 28" aria-hidden="true"><path d="M17 6 L9 14 L17 22"></path></svg>
      </button>
      <div class="tl__track">
        <div class="tl__line"></div>
        <div class="tl__years" id="tl-years"></div>
      </div>
      <button class="round" type="button" id="tl-next" data-alt-text="yearsNext">
        <svg class="round__icon" width="20" height="20" viewBox="0 0 28 28" aria-hidden="true"><path d="M11 6 L19 14 L11 22"></path></svg>
      </button>
    </div>

    <div class="album" id="album">
      <div class="album__sheet album__sheet--3"></div>
      <div class="album__sheet album__sheet--2"></div>
      <div class="album__sheet album__sheet--1"></div>
      <div class="album__half album__half--l" id="page-l"></div>
      <div class="album__half album__half--r" id="page-r"></div>
      <div class="album__under" id="album-under"></div>
      <div class="album__spine"></div>
      <div class="album__leaf" id="album-leaf">
        <div class="album__face" id="leaf-front"></div>
        <div class="album__face album__face--back" id="leaf-back"></div>
      </div>
      <button class="album__corner album__corner--l" type="button" id="corner-prev" data-alt-text="spreadPrev"></button>
      <button class="album__corner album__corner--r" type="button" id="corner-next" data-alt-text="spreadNext"></button>
    </div>

    <button class="round round--lg album__nav album__nav--prev" type="button" id="album-prev" data-alt-text="spreadPrev">
      <svg class="round__icon" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><path d="M17 6 L9 14 L17 22"></path></svg>
    </button>
    <button class="round round--lg round--primary album__nav album__nav--next" type="button" id="album-next" data-alt-text="spreadNext">
      <svg class="round__icon" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><path d="M11 6 L19 14 L11 22"></path></svg>
    </button>

    <div class="album-foot">
      <span class="album-foot__year" id="foot-year"></span>
      <div class="album-foot__dots" id="foot-dots"></div>
      <span class="album-foot__spread" id="foot-spread"></span>
      <span class="album-foot__no" id="foot-no"></span>
    </div>
  </div>
</template>

<!-- Страницы альбома: gallery.js клонирует их и заполняет из js/data/gallery.js. -->
<template id="tpl-page-title">
  <div class="page">
    <div class="page__top">
      <span data-text="release"></span>
      <span class="page__num" data-slot="num"></span>
    </div>
    <span class="page__year" data-slot="year"></span>
    <span class="page__meta" data-slot="meta"></span>
    <button class="photo photo--fill" type="button" data-slot="photo0"></button>
    <span class="page__caption" data-slot="caption"></span>
  </div>
</template>

<template id="tpl-page-photos">
  <div class="page">
    <div class="page__top">
      <span data-slot="release"></span>
      <span class="page__num" data-slot="num"></span>
    </div>
    <button class="photo photo--big" type="button" data-slot="photo0"></button>
    <span class="page__caption" data-slot="caption"></span>
    <div class="page__row">
      <button class="photo photo--small" type="button" data-slot="photo1"></button>
      <button class="photo photo--small" type="button" data-slot="photo2"></button>
    </div>
  </div>
</template>

<template id="tpl-page-end">
  <div class="page page--end">
    <span data-text="albumEnd"></span>
  </div>
</template>

<template id="tpl-corner">
  <div class="corner" id="corner" data-sound="off">
    <button class="corner__btn" type="button" id="btn-about">
      <svg class="corner__icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 11 V17"></path>
        <circle class="corner__icon-dot" cx="12" cy="7.5" r=".6"></circle>
      </svg>
      <span data-text="about"></span>
    </button>

    <button class="corner__btn" type="button" id="btn-sound" aria-pressed="false">
      <svg class="corner__icon corner__icon--sound" width="24" height="24" viewBox="0 0 26 26" aria-hidden="true">
        <path d="M3 10 H8 L14 5 V21 L8 16 H3 Z"></path>
        <path class="snd-on" d="M17.5 9.5 Q20 13 17.5 16.5"></path>
        <path class="snd-on" d="M20 6.5 Q25 13 20 19.5"></path>
        <path class="snd-off" d="M18 10 L24 16 M24 10 L18 16"></path>
      </svg>
      <span id="sound-label"></span>
    </button>
  </div>
</template>

<template id="tpl-about">
  <div class="about" id="about-overlay" role="dialog" aria-modal="true" aria-labelledby="about-title">
    <div class="about__dialog" id="about-dialog">
      <h2 class="about__title" id="about-title" data-text="aboutTitle"></h2>
      <p class="about__text" data-text="aboutText1"></p>
      <p class="about__text about__text--dim" data-text="aboutText2"></p>
      <button class="about__ok" type="button" id="btn-about-ok" data-text="aboutOk"></button>
    </div>
  </div>
</template>

<script src="js/config.js"></script>
<script src="js/data/gallery.js"></script>
<script src="js/screens.js"></script>
<script src="js/gallery.js"></script>
<script src="js/main.js"></script>
</body>
</html>
