<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Путешествие по Политеху</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>
:root{
  /* Палитра по сайту cyber.istu.edu */
  --c-page:#E8EDF4;
  --c-bg:#F6F8FB;
  --c-surface:#FFFFFF;
  --c-ink:#0E1A2B;
  --c-ink-dim:#5B6B80;
  --c-line:#D3DCE8;
  --c-blue:#0A66FF;
  --c-blue-deep:#0B47A8;
  --c-teal:#14A3B8;
  --c-glow:rgba(10,102,255,.16);
  --c-grid:rgba(11,71,168,.07);
  --c-circuit:rgba(11,71,168,.14);
  --c-code:rgba(11,71,168,.085);
  --g-title:linear-gradient(90deg, var(--c-teal), var(--c-blue-deep));
}
html,body{margin:0;height:100%;background:var(--c-page);overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
a{color:var(--c-blue)}a:hover{color:var(--c-blue-deep)}
button{font:inherit;color:inherit}
@keyframes pp-float{from{transform:translate(0,0)}to{transform:translate(40px,-30px)}}
@keyframes pp-code{from{transform:translateY(-50%)}to{transform:translateY(0)}}
@keyframes pp-trace{from{stroke-dashoffset:0}to{stroke-dashoffset:-600}}
@keyframes pp-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pp-pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position:fixed;inset:0;background:var(--c-page);overflow:hidden;font-family:Montserrat, system-ui, sans-serif;color:var(--c-ink);user-select:none">
  <div data-screen-label="Stage" style="position:absolute;left:50%;top:50%;width:{{ stageW }};height:{{ stageH }};transform:{{ stageTransform }};transform-origin:center;overflow:hidden;border-radius:14px;background:var(--c-bg);box-shadow:0 24px 60px rgba(14,26,43,.14), 0 0 0 1px var(--c-line)">
    {{ bgLayer }}

    <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ true }}">
      <div data-screen-label="Загрузка" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;background:var(--c-bg)">
        <img src="assets/logo-irnitu.png" alt="Логотип ИРНИТУ" style="width:200px;height:200px;display:block;border-radius:50%;animation:pp-pop .5s ease-out both">
        <div style="display:flex;flex-direction:column;gap:16px;width:520px;max-width:80%">
          <div style="width:100%;height:6px;border-radius:3px;background:var(--c-line);overflow:hidden">
            <div style="height:100%;width:{{ progressPct }};background:var(--c-blue);box-shadow:0 0 12px var(--c-blue)"></div>
          </div>
          <div style="display:flex;justify-content:space-between;width:100%;font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--c-ink-dim)">
            <span>{{ t.loading }}</span>
            <span style="font-family:'JetBrains Mono', monospace;letter-spacing:0;color:var(--c-blue)">{{ progressLabel }}</span>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isMenu }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="Меню" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:{{ menuGap }};padding:60px;animation:pp-in .45s ease-out both">
        <img src="assets/ipolytech.svg" alt="ipolytech" style="height:{{ markH }};width:auto;display:block">
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
          <h1 style="margin:0;padding-bottom:6px;font-weight:800;font-size:{{ titleSize }};line-height:1.05;letter-spacing:-.015em;text-wrap:balance;background:var(--g-title);-webkit-background-clip:text;background-clip:text;color:transparent">{{ t.title }}</h1>
          <p style="margin:0;font-size:24px;font-weight:500;color:var(--c-ink-dim)">{{ t.tagline }}</p>
        </div>
        <div style="display:flex;flex-direction:{{ modesDir }};gap:36px;margin-top:14px">
          <button onClick="{{ openAlumni }}" onMouseEnter="{{ hover }}" style="width:{{ modeW }};height:160px;display:flex;align-items:center;gap:30px;padding:0 36px 0 40px;border:1.5px solid var(--c-line);border-radius:16px;cursor:pointer;text-align:left;background:var(--c-surface);box-shadow:0 2px 0 var(--c-line), 0 10px 24px rgba(14,26,43,.06);transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease" style-hover="transform:translateY(-4px);border-color:var(--c-blue);box-shadow:0 0 0 5px var(--c-glow), 0 18px 36px rgba(10,102,255,.18)" style-active="transform:translateY(1px);border-color:var(--c-blue);box-shadow:0 0 0 3px var(--c-glow), 0 4px 10px rgba(10,102,255,.14)">
            <svg width="68" height="68" viewBox="0 0 68 68" fill="none" stroke="var(--c-blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="flex:none">
              <rect x="6" y="16" width="46" height="38" rx="3"></rect>
              <path d="M14 10 H60 V46"></path>
              <circle cx="38" cy="29" r="4"></circle>
              <path d="M6 46 L20 32 L34 46"></path>
              <path d="M28 40 L34 34 L52 50"></path>
            </svg>
            <div style="display:flex;flex-direction:column;gap:10px;min-width:0;flex:1">
              <span style="font-weight:700;font-size:34px;line-height:1.1;white-space:nowrap">{{ t.alumniTitle }}</span>
              <span style="font-size:20px;font-weight:500;color:var(--c-ink-dim);white-space:nowrap">{{ t.alumniDesc }}</span>
            </div>
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="var(--c-blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 14 H22 M15 7 L22 14 L15 21"></path></svg>
          </button>
          <button onClick="{{ openApplicants }}" onMouseEnter="{{ hover }}" style="width:{{ modeW }};height:160px;display:flex;align-items:center;gap:30px;padding:0 36px 0 40px;border:1.5px solid var(--c-line);border-radius:16px;cursor:pointer;text-align:left;background:var(--c-surface);box-shadow:0 2px 0 var(--c-line), 0 10px 24px rgba(14,26,43,.06);transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease" style-hover="transform:translateY(-4px);border-color:var(--c-blue);box-shadow:0 0 0 5px var(--c-glow), 0 18px 36px rgba(10,102,255,.18)" style-active="transform:translateY(1px);border-color:var(--c-blue);box-shadow:0 0 0 3px var(--c-glow), 0 4px 10px rgba(10,102,255,.14)">
            <svg width="68" height="68" viewBox="0 0 68 68" fill="none" stroke="var(--c-blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="flex:none">
              <circle cx="34" cy="34" r="27"></circle>
              <polygon points="44,24 38,38 24,44 30,30"></polygon>
              <circle cx="34" cy="34" r="2"></circle>
              <path d="M34 7 V12 M34 56 V61 M7 34 H12 M56 34 H61"></path>
            </svg>
            <div style="display:flex;flex-direction:column;gap:10px;min-width:0;flex:1">
              <span style="font-weight:700;font-size:34px;line-height:1.1;white-space:nowrap">{{ t.applicantsTitle }}</span>
              <span style="font-size:20px;font-weight:500;color:var(--c-ink-dim);white-space:nowrap">{{ t.applicantsDesc }}</span>
            </div>
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="var(--c-blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 14 H22 M15 7 L22 14 L15 21"></path></svg>
          </button>
        </div>
      </div>
      <div style="position:absolute;left:36px;bottom:30px;display:flex;align-items:center;gap:16px;animation:pp-in .45s ease-out both">
        <img src="assets/logo-irnitu.png" alt="Логотип ИРНИТУ" style="width:58px;height:58px;border-radius:50%;display:block">
        <span style="font-size:15px;font-weight:600;line-height:1.35;color:var(--c-ink-dim);max-width:{{ footW }}">{{ t.university }}</span>
      </div>
    </sc-if>

    <sc-if value="{{ isStub }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="Заглушка" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:60px;animation:pp-in .4s ease-out both">
        <div style="width:860px;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center;padding:60px 56px 56px;border-radius:18px;background:var(--c-surface);border:1.5px solid var(--c-line);box-shadow:0 20px 50px rgba(14,26,43,.08)">
          <span style="padding:9px 18px;border-radius:6px;background:var(--c-blue);font-weight:700;font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:#fff">{{ stub.title }}</span>
          <h2 style="margin:0;padding-bottom:4px;font-weight:800;font-size:60px;line-height:1.1;text-wrap:balance;background:var(--g-title);-webkit-background-clip:text;background-clip:text;color:transparent">{{ t.soonTitle }}</h2>
          <p style="margin:0;font-size:26px;line-height:1.5;font-weight:500;color:var(--c-ink-dim);text-wrap:pretty;max-width:660px">{{ stub.soon }}</p>
          <button onClick="{{ backToMenu }}" onMouseEnter="{{ hover }}" style="margin-top:12px;height:80px;padding:0 40px 0 32px;border:1.5px solid var(--c-blue);border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:16px;font-weight:700;font-size:26px;color:#fff;background:var(--c-blue);box-shadow:0 8px 20px rgba(10,102,255,.25);transition:transform .18s ease, box-shadow .18s ease, background .18s ease" style-hover="transform:translateY(-3px);background:var(--c-blue-deep);box-shadow:0 0 0 5px var(--c-glow), 0 14px 30px rgba(10,102,255,.3)" style-active="transform:translateY(1px);box-shadow:0 0 0 3px var(--c-glow)">
            <svg width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 14 H6 M13 7 L6 14 L13 21"></path></svg>
            <span>{{ t.back }}</span>
          </button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ showCorner }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:30px;right:32px;display:flex;gap:12px;z-index:5">
        <button onClick="{{ openAbout }}" onMouseEnter="{{ hover }}" style="height:56px;padding:0 22px 0 16px;display:flex;align-items:center;gap:10px;border:1.5px solid var(--c-line);border-radius:10px;cursor:pointer;font-weight:600;font-size:18px;color:var(--c-ink);background:var(--c-surface);transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease" style-hover="transform:translateY(-2px);border-color:var(--c-blue);box-shadow:0 0 0 4px var(--c-glow)" style-active="transform:translateY(1px)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--c-blue)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 11 V17"></path><circle cx="12" cy="7.5" r=".6" fill="var(--c-blue)"></circle></svg>
          <span>{{ t.about }}</span>
        </button>
        <button onClick="{{ toggleSound }}" aria-pressed="{{ soundOn }}" style="height:56px;padding:0 22px 0 16px;display:flex;align-items:center;gap:10px;border:1.5px solid var(--c-line);border-radius:10px;cursor:pointer;font-weight:600;font-size:18px;color:var(--c-ink);background:var(--c-surface);transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease" style-hover="transform:translateY(-2px);border-color:var(--c-blue);box-shadow:0 0 0 4px var(--c-glow)" style-active="transform:translateY(1px)">
          <svg width="24" height="24" viewBox="0 0 26 26" fill="none" stroke="var(--c-blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
            <path d="M3 10 H8 L14 5 V21 L8 16 H3 Z"></path>
            <sc-if value="{{ soundOn }}" hint-placeholder-val="{{ false }}">
              <path d="M17.5 9.5 Q20 13 17.5 16.5"></path>
              <path d="M20 6.5 Q25 13 20 19.5"></path>
            </sc-if>
            <sc-if value="{{ soundOff }}" hint-placeholder-val="{{ true }}">
              <path d="M18 10 L24 16 M24 10 L18 16"></path>
            </sc-if>
          </svg>
          <span>{{ soundLabel }}</span>
        </button>
      </div>
    </sc-if>

    <sc-if value="{{ aboutOpen }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ closeAbout }}" style="position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:60px;background:rgba(14,26,43,.35);backdrop-filter:blur(3px);animation:pp-in .2s ease-out both">
        <div onClick="{{ stop }}" style="width:800px;max-width:100%;display:flex;flex-direction:column;gap:24px;padding:48px 52px;border-radius:18px;background:var(--c-surface);border:1.5px solid var(--c-line);box-shadow:0 30px 70px rgba(14,26,43,.25);animation:pp-pop .25s ease-out both">
          <h2 style="margin:0;font-weight:800;font-size:42px;color:var(--c-blue-deep)">{{ t.aboutTitle }}</h2>
          <p style="margin:0;font-size:23px;line-height:1.55;font-weight:500;color:var(--c-ink);text-wrap:pretty">{{ t.aboutText1 }}</p>
          <p style="margin:0;font-size:23px;line-height:1.55;font-weight:500;color:var(--c-ink-dim);text-wrap:pretty">{{ t.aboutText2 }}</p>
          <button onClick="{{ closeAbout }}" onMouseEnter="{{ hover }}" style="align-self:flex-start;margin-top:8px;height:68px;padding:0 40px;border:1.5px solid var(--c-blue);border-radius:12px;cursor:pointer;font-weight:700;font-size:22px;color:#fff;background:var(--c-blue);transition:transform .16s ease, box-shadow .16s ease, background .16s ease" style-hover="transform:translateY(-2px);background:var(--c-blue-deep);box-shadow:0 0 0 5px var(--c-glow)" style-active="transform:translateY(1px)">{{ t.aboutOk }}</button>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
// ===== ВСЁ, ЧТО МОЖНО МЕНЯТЬ: тексты, тайминги (цвета — CSS-переменные в <style>) =====
// Пути к картинкам прописаны в src тегов <img>: assets/ipolytech.svg, assets/logo-irnitu.png
const CONFIG = {
  loaderMs: 1500,
  texts: {
    loading: 'Загрузка',
    title: 'Путешествие по Политеху',
    tagline: 'Игра-путешествие по истории университета',
    alumniTitle: 'Для выпускников',
    alumniDesc: 'Фотоальбом выпусков разных лет',
    alumniSoon: 'фотоальбом выпусков: листайте снимки выпускников Политеха разных лет и находите знакомые лица.',
    applicantsTitle: 'Для поступающих',
    applicantsDesc: 'История направлений и институтов',
    applicantsSoon: 'история направлений: выберите институт или направление и узнайте, как оно появилось и развивалось.',
    soonTitle: 'Скоро здесь будет…',
    back: 'Назад в меню',
    about: 'Об игре',
    soundOn: 'Звук: вкл',
    soundOff: 'Звук: выкл',
    aboutTitle: 'Об игре',
    aboutText1: '«Путешествие по Политеху» — игра о том, как рос и менялся Иркутский национальный исследовательский технический университет.',
    aboutText2: 'Выпускники смогут пролистать фотоальбом выпусков, а поступающие — узнать историю направлений и институтов.',
    aboutOk: 'Понятно',
    university: 'Иркутский национальный исследовательский технический университет',
  },
};

class Component extends DCLogic {
  state = { screen: 'loading', progress: 0, sound: false, about: false, mode: null, vw: window.innerWidth, vh: window.innerHeight };

  componentDidMount() {
    this.onResize = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight });
    window.addEventListener('resize', this.onResize);
    this.onMove = (e) => {
      const nx = e.clientX / window.innerWidth - 0.5, ny = e.clientY / window.innerHeight - 0.5;
      if (this.l1) this.l1.style.transform = `translate(${nx * -14}px, ${ny * -10}px)`;
      if (this.l2) this.l2.style.transform = `translate(${nx * -30}px, ${ny * -20}px)`;
    };
    window.addEventListener('pointermove', this.onMove);
    this.onKey = (e) => { if (e.key === 'Escape') { if (this.state.about) this.setState({ about: false }); else if (this.state.screen === 'stub') this.goMenu(); } };
    window.addEventListener('keydown', this.onKey);
    ['assets/ipolytech.svg', 'assets/logo-irnitu.png'].forEach(src => { const i = new Image(); i.src = src; });
    const t0 = performance.now();
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / CONFIG.loaderMs);
      this.setState({ progress: 1 - Math.pow(1 - p, 2.2) });
      if (p < 1) this.raf = requestAnimationFrame(tick);
      else this.to = setTimeout(() => this.setState({ screen: 'menu' }), 250);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('pointermove', this.onMove);
    window.removeEventListener('keydown', this.onKey);
    cancelAnimationFrame(this.raf); clearTimeout(this.to);
  }

  blip(freq = 660, dur = 0.06, type = 'sine', vol = 0.06) {
    if (!this.state.sound) return;
    try {
      this.ac = this.ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = this.ac.createOscillator(), g = this.ac.createGain(), t = this.ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.05);
      o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur + 0.06);
    } catch (e) {}
  }
  goMenu() { this.blip(440); this.setState({ screen: 'menu', mode: null }); }
  openMode(mode) { this.blip(880, 0.1); this.setState({ screen: 'stub', mode }); }

  buildBg() {
    if (this._bg) return this._bg;
    const e = React.createElement;
    let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const colText = () => Array.from({ length: 40 }, () => Array.from({ length: 1 + Math.floor(rnd() * 3) }, () => (rnd() > 0.5 ? '1' : '0')).join('')).join('\n');
    const codeCols = [3, 9, 16, 84, 91, 97].map((x, i) => {
      const txt = colText(), dur = 60 + rnd() * 50;
      return e('div', { key: i, style: { position: 'absolute', left: x + '%', top: 0, fontFamily: "'JetBrains Mono', monospace", fontSize: 16, lineHeight: '26px', whiteSpace: 'pre', color: 'var(--c-code)', animation: `pp-code ${dur}s linear ${-rnd() * dur}s infinite` } }, txt + '\n' + txt);
    });
    const trace = (d, k) => [
      e('path', { key: k + 'a', d, stroke: 'var(--c-circuit)', strokeWidth: 1.5, fill: 'none' }),
      e('path', { key: k + 'b', d, stroke: 'var(--c-blue)', strokeOpacity: 0.35, strokeWidth: 1.5, fill: 'none', strokeDasharray: '40 560', style: { animation: `pp-trace ${9 + k * 2}s linear ${-k * 3}s infinite` } }),
    ];
    const node = (x, y, k) => e('circle', { key: k, cx: x, cy: y, r: 4, fill: 'var(--c-bg)', stroke: 'var(--c-circuit)', strokeWidth: 1.5 });
    const circuitTL = e('svg', { width: 560, height: 380, viewBox: '0 0 560 380', style: { position: 'absolute', left: 0, top: 0 } },
      ...trace('M0 90 H180 L230 140 H420', 0), node(420, 140, 'n0'),
      ...trace('M0 150 H120 L200 230 H300 L340 270', 1), node(340, 270, 'n1'),
      ...trace('M120 0 V50 L160 90', 2), node(160, 90, 'n2'));
    const circuitBR = e('svg', { width: 560, height: 380, viewBox: '0 0 560 380', style: { position: 'absolute', right: 0, bottom: 0 } },
      ...trace('M560 290 H380 L330 240 H140', 3), node(140, 240, 'n3'),
      ...trace('M560 230 H440 L360 150 H260 L220 110', 4), node(220, 110, 'n4'),
      ...trace('M440 380 V330 L400 290', 5), node(400, 290, 'n5'));
    const layer = { position: 'absolute', inset: '-40px', transition: 'transform .9s cubic-bezier(.2,.7,.3,1)', pointerEvents: 'none' };
    const mask = 'radial-gradient(ellipse 60% 55% at 50% 48%, transparent 30%, #000 85%)';
    this._bg = e('div', { style: { position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden' } },
      e('div', { ref: r => (this.l1 = r), style: layer },
        e('div', { style: { position: 'absolute', inset: 0, backgroundImage: 'linear-gradient(var(--c-grid) 1px, transparent 1px), linear-gradient(90deg, var(--c-grid) 1px, transparent 1px)', backgroundSize: '40px 40px' } }),
        e('div', { style: { position: 'absolute', inset: 0, backgroundImage: 'linear-gradient(var(--c-grid) 1px, transparent 1px), linear-gradient(90deg, var(--c-grid) 1px, transparent 1px)', backgroundSize: '200px 200px' } }),
        e('div', { style: { position: 'absolute', inset: 0, WebkitMaskImage: mask, maskImage: mask } }, codeCols)
      ),
      e('div', { ref: r => (this.l2 = r), style: layer }, circuitTL, circuitBR),
      e('div', { style: { position: 'absolute', inset: 0, background: 'radial-gradient(ellipse 55% 50% at 50% 48%, var(--c-bg) 35%, transparent 80%)', opacity: 0.85 } })
    );
    return this._bg;
  }

  renderVals() {
    const T = CONFIG.texts, s = this.state;
    const portrait = s.vw / s.vh < 0.85;
    const W = portrait ? 900 : 1600, H = portrait ? 1600 : 900;
    const scale = Math.min(s.vw / W, s.vh / H) * (s.vw < 700 || s.vh < 500 ? 1 : 0.96);
    const stubs = {
      alumni: { title: T.alumniTitle, soon: 'Здесь будет ' + T.alumniSoon },
      applicants: { title: T.applicantsTitle, soon: 'Здесь будет ' + T.applicantsSoon },
    };
    return {
      t: T,
      bgLayer: this.buildBg(),
      stageW: W + 'px', stageH: H + 'px',
      stageTransform: `translate(-50%, -50%) scale(${scale})`,
      modesDir: portrait ? 'column' : 'row',
      modeW: portrait ? '760px' : '680px',
      markH: portrait ? '220px' : '150px',
      titleSize: portrait ? '76px' : '78px',
      menuGap: portrait ? '40px' : '28px',
      footW: portrait ? '600px' : '340px',
      isLoading: s.screen === 'loading', isMenu: s.screen === 'menu', isStub: s.screen === 'stub',
      showCorner: s.screen !== 'loading',
      progressPct: Math.round(s.progress * 100) + '%',
      progressLabel: String(Math.round(s.progress * 100)).padStart(3, '0') + '%',
      stub: stubs[s.mode] || stubs.alumni,
      soundOn: s.sound, soundOff: !s.sound,
      soundLabel: s.sound ? T.soundOn : T.soundOff,
      aboutOpen: s.about,
      hover: () => this.blip(620, 0.04, 'sine', 0.03),
      openAlumni: () => this.openMode('alumni'),
      openApplicants: () => this.openMode('applicants'),
      backToMenu: () => this.goMenu(),
      openAbout: () => { this.blip(700); this.setState({ about: true }); },
      closeAbout: () => { this.blip(440); this.setState({ about: false }); },
      stop: (e) => e.stopPropagation(),
      toggleSound: () => this.setState(p => ({ sound: !p.sound }), () => this.blip(760, 0.08)),
    };
  }
}
</script>
</body>
</html>
